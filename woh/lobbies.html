<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервера игры</title>
    <style>
        @font-face {
            font-family: 'fifaks10dev1';
            src: url('Fifaks10Dev1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent !important;
            font-family: 'fifaks10dev1', 'Courier New', monospace;
            color: #ffffff;
            padding: 15px;
            overflow-y: auto;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
        }

        .server-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(139, 69, 19, 0.75);
            border: 2px solid #ffd48a;
            border-radius: 0;
            padding: 8px 12px;
            height: 44px;
            box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.1), inset -2px -2px 0 rgba(0, 0, 0, 0.4);
            image-rendering: pixelated;
            transition: filter 0.2s;
            cursor: pointer;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .server-item:hover {
            filter: brightness(1.1);
            border-color: #ffe4a0;
        }

        .server-info {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 24px;
        }

        .server-logo {
            height: 24px;
            width: auto;
            max-width: 24px;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        .server-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .server-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f0f0f0;
            height: 24px;
        }

        .server-players {
            font-size: 15px;
            color: #c0c0c0;
        }

        .server-lock {
            height: 16px;
            width: auto;
            max-width: 16px;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }
    </style>
</head>
<body>

    <div id="serversContainer" class="server-list">
    </div>

    <script>
        const servers = [
            { 
                id: 1,
                name: "Арена 1x1", 
                modeLogo: "https://raw.githubusercontent.com/bahr-projects/bahr-projects.github.io/refs/heads/main/woh/assets/1v1.png", 
                players: "1/2", 
                isPrivate: true 
            },
            { 
                id: 2,
                name: "Командный бой", 
                modeLogo: "https://raw.githubusercontent.com/bahr-projects/bahr-projects.github.io/refs/heads/main/woh/assets/1v1.png", 
                players: "4/8", 
                isPrivate: false 
            },
            { 
                id: 3,
                name: "Сервер Свободы", 
                modeLogo: "https://raw.githubusercontent.com/bahr-projects/bahr-projects.github.io/refs/heads/main/woh/assets/1v1.png", 
                players: "3/16", 
                isPrivate: false 
            },
            { 
                id: 4,
                name: "Приватный матч", 
                modeLogo: "https://raw.githubusercontent.com/bahr-projects/bahr-projects.github.io/refs/heads/main/woh/assets/1v1.png", 
                players: "1/1", 
                isPrivate: true 
            },
            { 
                id: 5,
                name: "1v1 Рейтинг", 
                modeLogo: "https://raw.githubusercontent.com/bahr-projects/bahr-projects.github.io/refs/heads/main/woh/assets/1v1.png", 
                players: "0/2", 
                isPrivate: false 
            }
        ];

        const container = document.getElementById('serversContainer');
        const lockIconUrl = "https://raw.githubusercontent.com/bahr-projects/bahr-projects.github.io/refs/heads/main/woh/assets/locked.png";

        function renderServers(data) {
            container.innerHTML = '';
            
            data.forEach(server => {
                const item = document.createElement('div');
                item.className = 'server-item';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'server-info';
                
                const logo = document.createElement('img');
                logo.src = server.modeLogo;
                logo.className = 'server-logo';
                logo.alt = 'Mode';
                
                const name = document.createElement('span');
                name.className = 'server-name';
                name.textContent = server.name;

                infoDiv.appendChild(logo);
                infoDiv.appendChild(name);

                const statsDiv = document.createElement('div');
                statsDiv.className = 'server-stats';

                const playersSpan = document.createElement('span');
                playersSpan.className = 'server-players';
                playersSpan.textContent = server.players;

                statsDiv.appendChild(playersSpan);

                if (server.isPrivate) {
                    const lockImg = document.createElement('img');
                    lockImg.src = lockIconUrl;
                    lockImg.className = 'server-lock';
                    lockImg.alt = 'Locked';
                    statsDiv.appendChild(lockImg);
                }

                item.appendChild(infoDiv);
                item.appendChild(statsDiv);

                container.appendChild(item);
            });
        }

        renderServers(servers);
    </script>
</body>
</html>
